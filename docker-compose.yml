services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coopera
      POSTGRES_PASSWORD: coopera
      POSTGRES_DB: coopera
    ports:
      - "5432:5432"
    volumes:
      - coopera_db_data:/var/lib/postgresql/data

volumes:
  coopera_db_data:
