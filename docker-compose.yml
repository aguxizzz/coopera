services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coopero
      POSTGRES_PASSWORD: coopero
      POSTGRES_DB: coopero
    ports:
      - "5432:5432"
    volumes:
      - coopero_db_data:/var/lib/postgresql/data

volumes:
  coopero_db_data:
